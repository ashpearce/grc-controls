name: Debug - OIDC claims

# Temporary diagnostic. Prints the claims AWS checks (sub, aud, repository),
# then tries to assume the sandbox verifier role. Delete this file when done.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show the claims GitHub puts in the token
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')"
          payload="$(echo "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l==2) print $0"=="; else if (l==3) print $0"="; else print $0 }' | base64 -d)"
          echo "$payload" | jq '{sub, aud, repository, repository_owner, ref, event_name}'

      - name: Secrets present? (prints lengths only)
        run: |
          echo "role arn length: ${#ROLE}"
          echo "account id length: ${#ACCT}"
        env:
          ROLE: ${{ secrets.HB_SANDBOX_VERIFIER_ROLE_ARN }}
          ACCT: ${{ secrets.HB_SANDBOX_ACCOUNT_ID }}

      - name: Try to assume the role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HB_SANDBOX_VERIFIER_ROLE_ARN }}
          aws-region: us-east-1
          retry-max-attempts: 1

      - name: Who am I
        run: aws sts get-caller-identity
